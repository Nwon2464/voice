benchmark_name: luna-fast-20260814

# Paths are resolved relative to this YAML file.
contexts:
   - ~/.config/interview-assistant/global_contexts/profile.md
   - ~/.config/interview-assistant/global_contexts/answer_style.md

audio:
  directory: ../../voice_tests
  warmup: warmup.wav
  questions:
    - q01.wav
    - q02.wav
    - q03.wav
    - q04.wav
    - q05.wav
    - q06.wav
    - q07.wav
    - q08.wav
    - q09.wav
    - q10.wav

timeouts:
  startup_seconds: 90
  response_seconds: 90

# Each configuration runs three times. Each run keeps the warmup/Q01..Q10
# sequence intact.
configurations:
  - name: luna-low
    model: gpt-5.6-luna
    reasoning: low
    fast_mode: false
    stt_language: en
    runs: 3
  - name: luna-medium
    model: gpt-5.6-luna
    reasoning: medium
    fast_mode: true
    stt_language: en
    runs: 3

# Alternate Luna low (normal mode) and Luna medium (Fast Mode).
execution_sequence:
  - luna-low
  - luna-medium
  - luna-low
  - luna-medium
  - luna-low
  - luna-medium
